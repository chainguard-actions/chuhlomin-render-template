name: Render Template (binary)
description: Renders file based on template and passed variables (uses pre-compiled binary, no Docker required)

author: Konstantin Chukhlomin <mail@chuhlomin.com>

branding:
  icon: file-text
  color: purple

inputs:
  template:
    description: Path to template
    required: true

  vars:
    description: Variables to use in template
    required: false

  vars_path:
    description: Path to YAML file with variables
    required: false

  result_path:
    description: Desired path to result file (optional)
    required: false

  timezone:
    description: Timezone to use in `date` template function
    required: false

outputs:
  result:
    description: Rendered file content
    value: ${{ steps.run.outputs.result }}

runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Download binary
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ACTION_REPO: 'chuhlomin/render-template'
        ACTION_REF: 'v1.11'
      run: |
        OS=$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
        [ "$OS" = "macos" ] && OS="darwin"
        ARCH=$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
        [ "$ARCH" = "x64" ] && ARCH="amd64"
        [ "$ARCH" = "arm" ] && ARCH="armv7"
        EXT=""
        [ "$OS" = "windows" ] && EXT=".exe"
        BINARY="render-template_${OS}_${ARCH}${EXT}"
        DEST="$RUNNER_TEMP/render-template"
        mkdir -p "$DEST"
        gh release download "${ACTION_REF}" \
          --repo "${ACTION_REPO:-chuhlomin/render-template}" \
          --pattern "$BINARY" \
          --dir "$DEST"
        [ "$OS" != "windows" ] && chmod +x "$DEST/$BINARY"
        SAFE_BIN=$(printf '%s' "$DEST/$BINARY" | tr -d '\n\r')
        echo "RENDER_TEMPLATE_BIN=$SAFE_BIN" >> "$GITHUB_ENV"

    - name: Run
      id: run
      shell: bash
      env:
        INPUT_TEMPLATE: ${{ inputs.template }}
        INPUT_VARS: ${{ inputs.vars }}
        INPUT_VARS_PATH: ${{ inputs.vars_path }}
        INPUT_RESULT_PATH: ${{ inputs.result_path }}
        INPUT_TIMEZONE: ${{ inputs.timezone }}
      run: '"$RENDER_TEMPLATE_BIN"'
