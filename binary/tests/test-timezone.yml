name: Test timezone input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create template file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp"
          printf 'Zone test: {{ .name }}\n' > "$GITHUB_WORKSPACE/tests/tmp/tz.tmpl"

      - id: action
        uses: .
        continue-on-error: true
        with:
          template: tests/tmp/tz.tmpl
          vars: |
            name: Timezone
          timezone: America/New_York

      - name: Assert action rendered template with timezone set or failed gracefully
        env:
          RESULT: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but result output is empty"
              exit 1
            fi
            if echo "$RESULT" | grep -q "Zone test:"; then
              echo "PASS: template rendered with timezone input"
            else
              echo "FAIL: expected 'Zone test:' in result, got: $RESULT"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (release download unavailable under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
