name: Test vars_path rendering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide gh CLI shim (gh is not installed in the act image)
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-gh/gh" "$RUNNER_TEMP/fakebin/gh"
          chmod +x "$RUNNER_TEMP/fakebin/gh"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - name: Create template and vars file
        run: |
          mkdir -p "$RUNNER_TEMP/rt"
          printf 'image: {{ .image }}:{{ .tag }}' > "$RUNNER_TEMP/rt/vp.tmpl"
          printf 'image: nginx\ntag: "1.25"\n' > "$RUNNER_TEMP/rt/vars.yml"
      - id: action
        uses: .
        with:
          template: ${{ runner.temp }}/rt/vp.tmpl
          vars_path: ${{ runner.temp }}/rt/vars.yml
      - name: Assert result
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "image: nginx:1.25" ]; then
            echo "FAIL: expected 'image: nginx:1.25'"
            exit 1
          fi
          echo "PASS"
