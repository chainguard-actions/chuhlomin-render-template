name: Test template rendering with result_path output file
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          template: tests/fixtures/templates/hello.md
          vars: |
            name=ActTest
            version=2.0
          result_path: /tmp/rendered-output.md

      - name: Assert result file and output
        env:
          RESULT: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but result output is empty"
              exit 1
            fi
            if echo "$RESULT" | grep -q "Hello, ActTest!"; then
              echo "PASS: result output contains expected content"
            else
              echo "FAIL: result output does not contain 'Hello, ActTest!'"
              echo "Got: $RESULT"
              exit 1
            fi
            if [ -f "/tmp/rendered-output.md" ]; then
              FILE_CONTENT=$(cat /tmp/rendered-output.md)
              echo "file content: $FILE_CONTENT"
              if echo "$FILE_CONTENT" | grep -q "Hello, ActTest!"; then
                echo "PASS: result file contains expected content"
              else
                echo "FAIL: result file does not contain 'Hello, ActTest!'"
                exit 1
              fi
            else
              echo "FAIL: result file /tmp/rendered-output.md was not created"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (binary download likely failed due to act-harness ref)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
