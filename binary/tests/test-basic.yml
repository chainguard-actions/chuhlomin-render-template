name: Test basic template rendering with inline vars
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          template: tests/fixtures/templates/hello.md
          vars: |
            name=World
            version=1.0

      - name: Assert result
        env:
          RESULT: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but result output is empty"
              exit 1
            fi
            if echo "$RESULT" | grep -q "Hello, World!"; then
              echo "PASS: result contains expected greeting"
            else
              echo "FAIL: result does not contain 'Hello, World!'"
              echo "Got: $RESULT"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (binary download likely failed due to act-harness ref)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
