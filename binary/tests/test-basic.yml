name: Test basic vars rendering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide gh CLI shim (gh is not installed in the act image)
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-gh/gh" "$RUNNER_TEMP/fakebin/gh"
          chmod +x "$RUNNER_TEMP/fakebin/gh"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - name: Create template
        run: |
          mkdir -p "$RUNNER_TEMP/rt"
          printf 'Hello {{ .name }} from {{ .place }}!' > "$RUNNER_TEMP/rt/basic.tmpl"
      - id: action
        uses: .
        with:
          template: ${{ runner.temp }}/rt/basic.tmpl
          vars: |
            name: World
            place: Earth
      - name: Assert result
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "Hello World from Earth!" ]; then
            echo "FAIL: expected 'Hello World from Earth!'"
            exit 1
          fi
          echo "PASS"
