name: release

on:
  push:
    tags:
      - 'v1.*'

permissions:
  contents: write

env:
  DOCKER_IMAGE: chuhlomin/render-template

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Get the tag
        id: get_tag
        run: echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: chuhlomin/actions/docker-build-push@eae78b5dcc38d93d9d5c5d40eb2c164740f3a764 # main
        with:
          username: chuhlomin
          password: ${{ secrets.DOCKER_PASSWORD }}
          image_name: ${{ env.DOCKER_IMAGE }}
          tags: ${{ env.DOCKER_IMAGE }}:${{ steps.get_tag.outputs.tag }}

  update-tag:
    runs-on: ubuntu-latest
    environment: v1 # requires approval
    needs: release
    if: startsWith(github.ref, 'refs/tags/v1.')
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Update v1 tag
        shell: bash
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "gha@chuhlomin.com"
          git tag -f v1
          git push -f origin v1
