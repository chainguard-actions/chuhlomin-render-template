name: main

on:
  push:
    branches:
      - main

permissions: {}

env:
  DOCKER_IMAGE: chuhlomin/render-template

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Build and push Docker image
        uses: chuhlomin/actions/docker-build-push@eae78b5dcc38d93d9d5c5d40eb2c164740f3a764 # main
        with:
          username: chuhlomin
          password: ${{ secrets.DOCKER_PASSWORD }}
          image_name: ${{ env.DOCKER_IMAGE }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest

      - name: Test action
        uses: ./ # Uses an action in the root directory
        id: render
        with:
          template: ./testdata/template.txt
          vars: |
            name: world

      - name: Get `result` output
        env:
          RENDER_RESULT: ${{ steps.render.outputs.result }}
        run: echo "$RENDER_RESULT"
