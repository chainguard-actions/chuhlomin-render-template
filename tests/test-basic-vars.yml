name: Test basic template rendering with vars
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          template: actions/hardened/chuhlomin--render-template/v1.12/tests/fixtures/hello.tmpl
          vars: |
            name=World
            age=42

      - name: Assert result output contains expected content
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "Hello, World!"; then
            echo "PASS: found 'Hello, World!' in output"
          else
            echo "FAIL: expected 'Hello, World!' in output"
            exit 1
          fi
          if echo "$ACTUAL" | grep -q "42 years old"; then
            echo "PASS: found '42 years old' in output"
          else
            echo "FAIL: expected '42 years old' in output"
            exit 1
          fi
