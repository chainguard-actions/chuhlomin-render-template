name: Test missing template file fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          template: tests/fixtures/does-not-exist.tmpl
          vars: |
            name: World
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing template"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected empty result"
            exit 1
          fi
          echo "PASS"
