name: Test template rendering with vars_path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          template: actions/hardened/chuhlomin--render-template/v1.12/tests/fixtures/greeting.tmpl
          vars_path: actions/hardened/chuhlomin--render-template/v1.12/tests/fixtures/vars.yaml

      - name: Assert result output contains expected content from vars_path
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "Welcome, Alice!"; then
            echo "PASS: found 'Welcome, Alice!' in output"
          else
            echo "FAIL: expected 'Welcome, Alice!' in output"
            exit 1
          fi
          if echo "$ACTUAL" | grep -q "role is admin"; then
            echo "PASS: found 'role is admin' in output"
          else
            echo "FAIL: expected 'role is admin' in output"
            exit 1
          fi
