name: Test template rendering with vars_path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          template: tests/fixtures/deploy.template.yml
          vars_path: tests/fixtures/vars.yml

      - name: Assert output contains rendered deployment
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if echo "$RESULT" | grep -q "name: my-app"; then
            echo "PASS: deployment name rendered correctly"
          else
            echo "FAIL: expected 'name: my-app' in output"
            exit 1
          fi
          if echo "$RESULT" | grep -q "replicas: 3"; then
            echo "PASS: replicas rendered correctly"
          else
            echo "FAIL: expected 'replicas: 3' in output"
            exit 1
          fi
          if echo "$RESULT" | grep -q "image: nginx:latest"; then
            echo "PASS: image rendered correctly"
          else
            echo "FAIL: expected 'image: nginx:latest' in output"
            exit 1
          fi
