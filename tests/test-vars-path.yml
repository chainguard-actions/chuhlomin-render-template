name: Test template rendering with vars_path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: render
        uses: .
        with:
          template: tests/fixtures/templates/greeting.tmpl
          vars_path: tests/fixtures/vars/basic.yaml

      - name: Assert rendered output contains expected content from YAML vars
        env:
          ACTUAL: ${{ steps.render.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: output is empty"
            exit 1
          fi
          if echo "$ACTUAL" | grep -qF "Hello, World!"; then
            echo "PASS: output contains 'Hello, World!'"
          else
            echo "FAIL: expected output to contain 'Hello, World!' but got: $ACTUAL"
            exit 1
          fi
