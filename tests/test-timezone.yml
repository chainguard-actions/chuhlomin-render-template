name: Test rendering with timezone
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create template with date function in workspace
        run: |
          cat > "$GITHUB_WORKSPACE/date.tmpl" << 'EOF'
          Generated on: {{ .timestamp | date "2006" }}
          Location: {{ .location }}
          EOF

      - id: action
        uses: .
        with:
          template: date.tmpl
          vars: |
            location: New York
            timestamp: "2024-06-15T12:00:00Z"
          timezone: America/New_York

      - name: Assert result output contains year and location
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if echo "$RESULT" | grep -q "2024"; then
            echo "PASS: year rendered correctly"
          else
            echo "FAIL: expected '2024' in result"
            exit 1
          fi
          if echo "$RESULT" | grep -q "New York"; then
            echo "PASS: location rendered correctly"
          else
            echo "FAIL: expected 'New York' in result"
            exit 1
          fi
