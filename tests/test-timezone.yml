name: Test template rendering with timezone input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          template: tests/fixtures/timezone.tmpl
          vars: |
            timestamp: "2024-06-15T12:00:00Z"
          timezone: America/New_York

      - name: Assert rendered output contains timezone abbreviation
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          # America/New_York in June is EDT (UTC-4), so the MST format should show EDT
          if echo "$RESULT" | grep -qE "EDT|EST|New_York|Timezone:"; then
            echo "PASS: timezone rendered correctly"
          else
            echo "FAIL: expected timezone info in output, got: $RESULT"
            exit 1
          fi

      - name: Assert rendered output is non-empty
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ -z "$RESULT" ]; then
            echo "FAIL: expected non-empty output"
            exit 1
          fi
          echo "PASS: output is non-empty"
