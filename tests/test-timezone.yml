name: Test date function with timezone input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: render
        uses: .
        with:
          template: tests/fixtures/templates/date.tmpl
          vars: |
            released: "2023-05-11T01:42:04Z"
          timezone: America/New_York

      - name: Assert date converted to the given timezone
        env:
          RESULT: ${{ steps.render.outputs.result }}
        run: |
          echo "result: $RESULT"
          if echo "$RESULT" | grep -q "Released: 2023-05-10 21:42 EDT"; then
            echo "PASS: date rendered in America/New_York"
          else
            echo "FAIL: expected 'Released: 2023-05-10 21:42 EDT'"
            exit 1
          fi
