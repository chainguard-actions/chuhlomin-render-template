name: Test timezone input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          template: actions/hardened/chuhlomin--render-template/v1.9/tests/fixtures/date.tmpl
          timezone: America/New_York
      - name: Assert output is a 4-digit year
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]{4}$'; then
            echo "FAIL: expected a 4-digit year but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
