name: Test timezone input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create template file with date function
        run: |
          cat > /tmp/timezone-template.md << 'EOF'
          Timezone: {{ env "TZ" }}
          Hello: {{ .greeting }}
          EOF

      - id: action
        uses: .
        with:
          template: /tmp/timezone-template.md
          vars: |
            greeting=World
          timezone: America/New_York

      - name: Assert result contains greeting
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ -z "$RESULT" ]; then
            echo "FAIL: result is empty"
            exit 1
          fi
          if echo "$RESULT" | grep -q "World"; then
            echo "PASS: result contains greeting"
          else
            echo "FAIL: result does not contain expected greeting 'World'"
            exit 1
          fi
