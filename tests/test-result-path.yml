name: Test template rendering with result_path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          template: tests/fixtures/greeting.tmpl
          vars: |
            name: Alice
            age: 30
          result_path: tests/rendered-output.txt

      - name: Assert result output is set
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if echo "$RESULT" | grep -q "Hello, Alice!"; then
            echo "PASS: name rendered correctly in output"
          else
            echo "FAIL: expected 'Hello, Alice!' in output"
            exit 1
          fi

      - name: Assert result file was written
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/tests/rendered-output.txt" ]; then
            echo "FAIL: result file was not created at tests/rendered-output.txt"
            exit 1
          fi
          echo "PASS: result file exists"
          cat "$GITHUB_WORKSPACE/tests/rendered-output.txt"

      - name: Assert result file contains expected content
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/tests/rendered-output.txt")
          echo "file content: $CONTENT"
          if echo "$CONTENT" | grep -q "30 years old"; then
            echo "PASS: age rendered correctly in file"
          else
            echo "FAIL: expected '30 years old' in file"
            exit 1
          fi
