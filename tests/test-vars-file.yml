name: Test template rendering with vars file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          template: tests/fixtures/project.tmpl
          vars_path: tests/fixtures/vars.yaml

      - name: Assert rendered output contains project
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if echo "$RESULT" | grep -q "Project: MyApp"; then
            echo "PASS: project rendered correctly"
          else
            echo "FAIL: expected 'Project: MyApp' in output"
            exit 1
          fi

      - name: Assert rendered output contains version
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if echo "$RESULT" | grep -q "Version: 2.0.0"; then
            echo "PASS: version rendered correctly"
          else
            echo "FAIL: expected 'Version: 2.0.0' in output"
            exit 1
          fi

      - name: Assert rendered output contains author
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if echo "$RESULT" | grep -q "Author: Alice"; then
            echo "PASS: author rendered correctly"
          else
            echo "FAIL: expected 'Author: Alice' in output"
            exit 1
          fi
