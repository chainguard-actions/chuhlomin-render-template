name: Test basic template rendering with vars
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          template: actions/hardened/chuhlomin--render-template/v1.9/tests/fixtures/hello.tmpl
          vars: |
            name=World
      - name: Assert output contains rendered content
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "Hello, World!" ]; then
            echo "FAIL: expected 'Hello, World!' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
