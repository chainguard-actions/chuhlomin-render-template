name: Test basic template rendering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create template file in workspace
        run: |
          cat > "$GITHUB_WORKSPACE/hello.tmpl" << 'EOF'
          Hello, {{ .name }}! You are {{ .age }} years old.
          EOF

      - id: action
        uses: .
        with:
          template: hello.tmpl
          vars: |
            name: World
            age: 42

      - name: Assert result output
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if echo "$RESULT" | grep -q "Hello, World"; then
            echo "PASS: name rendered correctly"
          else
            echo "FAIL: expected 'Hello, World' in result"
            exit 1
          fi
          if echo "$RESULT" | grep -q "42"; then
            echo "PASS: age rendered correctly"
          else
            echo "FAIL: expected '42' in result"
            exit 1
          fi
