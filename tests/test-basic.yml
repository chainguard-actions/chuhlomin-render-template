name: Test basic template rendering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          template: tests/fixtures/greeting.tmpl
          vars: |
            name: World
            age: 42

      - name: Assert rendered output contains name
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if echo "$RESULT" | grep -q "Hello, World!"; then
            echo "PASS: name rendered correctly"
          else
            echo "FAIL: expected 'Hello, World!' in output"
            exit 1
          fi

      - name: Assert rendered output contains age
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if echo "$RESULT" | grep -q "42 years old"; then
            echo "PASS: age rendered correctly"
          else
            echo "FAIL: expected '42 years old' in output"
            exit 1
          fi
