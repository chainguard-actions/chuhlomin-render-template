name: Test vars_path and result_path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          template: actions/hardened/chuhlomin--render-template/v1.9/tests/fixtures/greeting.tmpl
          vars_path: actions/hardened/chuhlomin--render-template/v1.9/tests/fixtures/vars.yaml
          result_path: /tmp/rendered-output.txt
      - name: Assert result file was written
        run: |
          if [ ! -f /tmp/rendered-output.txt ]; then
            echo "FAIL: result file was not created at /tmp/rendered-output.txt"
            exit 1
          fi
          CONTENT=$(cat /tmp/rendered-output.txt)
          echo "content: $CONTENT"
          if [ "$CONTENT" != "Hello, World!" ]; then
            echo "FAIL: expected 'Hello, World!' but got '$CONTENT'"
            exit 1
          fi
          echo "PASS"
      - name: Assert output contains rendered content
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "Hello, World!" ]; then
            echo "FAIL: expected 'Hello, World!' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
