name: Test template rendering with result_path and timezone
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          template: actions/hardened/chuhlomin--render-template/v1.12/tests/fixtures/dated.tmpl
          vars: |
            project=MyApp
          result_path: /tmp/rendered-output.txt
          timezone: America/New_York

      - name: Assert result output contains expected content
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "Project: MyApp"; then
            echo "PASS: found 'Project: MyApp' in output"
          else
            echo "FAIL: expected 'Project: MyApp' in output"
            exit 1
          fi

      - name: Assert result file was written to result_path
        run: |
          if [ -f /tmp/rendered-output.txt ]; then
            echo "PASS: result file exists at /tmp/rendered-output.txt"
            cat /tmp/rendered-output.txt
          else
            echo "FAIL: result file not found at /tmp/rendered-output.txt"
            exit 1
          fi
          if grep -q "Project: MyApp" /tmp/rendered-output.txt; then
            echo "PASS: result file contains expected content"
          else
            echo "FAIL: result file does not contain expected content"
            exit 1
          fi
